services:
  studyflow-db:
    image: postgres:17-alpine
    container_name: studyflow-db
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      POSTGRES_DB: StudyFlow
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - studyflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  studyflow-postgres-data: